name: 🕓 Auto Update EPG (Kritere Clean Build Optimized)

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch:         # allow manual trigger from Actions tab

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 🧾 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 📦 Install dependencies
        run: npm install luxon fast-xml-parser linkedom

      - name: 🧠 Run merge_all_new.mjs
        run: node merge_all_new.mjs

      - name: 🔍 Check for EPG changes
        run: |
          if git diff --quiet merged_all.json; then
            echo "✅ No new EPG data — skipping commit."
            exit 0
          else
            echo "🟡 EPG changes detected — proceeding to commit."
          fi

      - name: 💾 Commit & push unified EPG
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Clean up unwanted local modifications
          git restore package.json || true
          git restore package-lock.json || true
          git clean -fdx node_modules || true

          # Stage only the merged_all.json file
          git add merged_all.json
          if git diff --cached --quiet; then
            echo "✅ No changes in merged_all.json after cleanup."
            exit 0
          fi

          git commit -m "🔄 Auto-update merged_all.json ($(date '+%F %T'))"
          git push
