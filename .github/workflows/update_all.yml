name: Update All EPG Sources (Optimized)

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 🧾 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 📦 Install dependencies
        run: npm install luxon fast-xml-parser

      - name: 🧠 Run merge_all_new.mjs
        run: node merge_all_new.mjs

      - name: 🔍 Check for changes
        run: |
          if git diff --quiet merged_all.json; then
            echo "No changes to commit."
            exit 0
          fi

      - name: 💾 Commit & push unified EPG
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add merged_all.json
          git commit -m "🔄 Auto-update merged_all.json ($(date '+%F %T'))"
          git push
